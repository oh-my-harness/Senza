[package]
name = "llm-harness-py"
version = "1.0.4"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "senza"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["macros", "py-clone"] }
llm-harness-types   = { path = "../llm-harness-runtime/crates/llm-harness-types" }
llm-harness-loop    = { path = "../llm-harness-runtime/crates/llm-harness-loop" }
llm-harness-agent   = { path = "../llm-harness-runtime/crates/llm-harness-agent" }
llm-harness-runtime = { path = "../llm-harness-runtime/crates/llm-harness-runtime" }
llm-harness-runtime-sandbox-os = { path = "../llm-harness-runtime/crates/llm-harness-runtime-sandbox-os" }
llm-harness-runtime-tools = { path = "../llm-harness-runtime/crates/llm-harness-runtime-tools" }
llm-harness-runtime-mcp = { path = "../llm-harness-runtime/crates/llm-harness-runtime-mcp" }
session-viewer     = { path = "../llm-harness-runtime/crates/session-viewer" }
llm-harness-strategy = { path = "../llm-harness-runtime/crates/llm-harness-strategy" }
llm-harness-runtime-knowledge = { path = "../llm-harness-runtime/crates/llm-harness-runtime-knowledge" }
llm-harness-runtime-knowledge-local = { path = "../llm-harness-runtime/crates/llm-harness-runtime-knowledge-local" }
llm-harness-runtime-session-recall = { path = "../llm-harness-runtime/crates/llm-harness-runtime-session-recall", features = ["sqlite"] }
llm-harness-runtime-memory = { path = "../llm-harness-runtime/crates/llm-harness-runtime-memory" }
llm-harness-runtime-audit-jsonl = { path = "../llm-harness-runtime/crates/llm-harness-runtime-audit-jsonl" }
llm-harness-runtime-trace-otel = { path = "../llm-harness-runtime/crates/llm-harness-runtime-trace-otel" }
parking_lot = "0.12"
chrono = "0.4"
serde_json = "1"
regex = "1"
anyhow = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "time"] }
futures = "0.3"
tokio-util = "0.7"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "registry"] }

[target.'cfg(target_os = "linux")'.dependencies]
llm-harness-runtime-sandbox-bwrap = { path = "../llm-harness-runtime/crates/llm-harness-runtime-sandbox-bwrap" }

[target.'cfg(target_os = "macos")'.dependencies]
llm-harness-runtime-sandbox-seatbelt = { path = "../llm-harness-runtime/crates/llm-harness-runtime-sandbox-seatbelt" }

[dev-dependencies]
pyo3 = { version = "0.29", features = ["macros", "py-clone", "auto-initialize"] }
tempfile = "3"
llm-harness-loop = { path = "../llm-harness-runtime/crates/llm-harness-loop", features = ["test-utils"] }

[features]
# extension-module is intentionally NOT in default: it must be off for
# `cargo test` so the test binaries link against libpython (via the
# `auto-initialize` dev-dependency). maturin enables it automatically
# when building the cdylib wheel, so production builds are unaffected.
default = []
extension-module = ["pyo3/extension-module"]
# test-utils 启用 drive() 测试方法、MockLlmClient Agent 等仅供测试/验证的功能。
# 生产构建（maturin develop --release / build）不应启用此 feature。
test-utils = ["llm-harness-loop/test-utils"]

[build-dependencies]
pyo3-build-config = "0.29"
